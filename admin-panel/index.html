<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Prim Hesaplama - Yönetim Paneli</title>
<style>
  :root {
    --indigo: #4F46E5;
    --red: #DC2626;
    --green: #16A34A;
    --amber: #F59E0B;
    --bg: #f2f4f8;
    --card: #ffffff;
    --border: #e6e8ee;
    --text: #1f2430;
    --muted: #8a8f9a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .hidden { display: none !important; }

  /* Login */
  #girisEkrani {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .girisKutu {
    background: var(--card);
    border-radius: 18px;
    padding: 32px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.08);
  }
  .girisHero {
    background: var(--indigo);
    border-radius: 14px;
    padding: 20px;
    text-align: center;
    margin-bottom: 22px;
    color: #fff;
  }
  .girisHero h1 { font-size: 20px; margin: 0 0 4px; }
  .girisHero p { font-size: 13px; margin: 0; opacity: 0.85; }
  label { font-size: 13px; font-weight: 600; display: block; margin: 14px 0 6px; }
  input {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #f7f8fb;
    font-size: 15px;
  }
  button {
    cursor: pointer;
    border: none;
    font-weight: 700;
    font-size: 15px;
    border-radius: 10px;
  }
  .anaButon {
    width: 100%;
    background: var(--indigo);
    color: #fff;
    padding: 13px;
    margin-top: 18px;
  }
  .hataMesaji { color: var(--red); font-size: 13px; margin-top: 12px; text-align: center; font-weight: 600; }

  /* Panel */
  #panelEkrani { max-width: 900px; margin: 0 auto; padding: 20px; }
  .ustBar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--indigo);
    border-radius: 16px;
    padding: 16px 20px;
    color: #fff;
    margin-bottom: 18px;
  }
  .ustBar h1 { font-size: 18px; margin: 0; }
  .cikisButon { background: rgba(255,255,255,0.2); color: #fff; padding: 8px 14px; font-size: 13px; }

  .sekmeler { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
  .sekmeButon {
    flex: 1;
    min-width: 150px;
    padding: 12px;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 13px;
  }
  .sekmeButon.aktif { background: var(--indigo); color: #fff; border-color: var(--indigo); }

  .kart {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .kartUst { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; flex-wrap: wrap; gap: 6px; }
  .kartIsim { font-weight: 700; font-size: 15px; }
  .kartEposta { font-size: 12px; color: var(--muted); }
  .rozet { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; color: #fff; white-space: nowrap; }
  .rozet.yeni { background: var(--amber); }
  .rozet.yanitlandi { background: var(--green); }
  .mesajMetni { font-size: 14px; margin: 8px 0; line-height: 1.5; white-space: pre-wrap; }
  .tarihMetni { font-size: 11px; color: var(--muted); }
  .yanitAlani { margin-top: 12px; }
  .yanitAlani textarea {
    width: 100%;
    min-height: 70px;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #f7f8fb;
    font-size: 14px;
    font-family: inherit;
    resize: vertical;
  }
  .yanitButon { background: var(--indigo); color: #fff; padding: 9px 16px; font-size: 13px; margin-top: 8px; }
  .yanitButon:disabled { opacity: 0.6; cursor: default; }
  .verilenYanit { background: #eef0fc; border-radius: 10px; padding: 10px; margin-top: 10px; font-size: 13px; }
  .verilenYanit b { color: var(--indigo); }
  .bosDurum { text-align: center; color: var(--muted); padding: 40px 0; font-style: italic; }
  .kartAltSatir { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
  .silButon { background: #fdecec; color: var(--red); padding: 8px 14px; font-size: 12px; }
  .geriYukleButon { background: #eaf7ee; color: var(--green); padding: 8px 14px; font-size: 12px; }
  .silinmisRozet { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; color: #fff; background: var(--muted); white-space: nowrap; }
</style>
</head>
<body>

<div id="girisEkrani">
  <div class="girisKutu">
    <div class="girisHero">
      <h1>Yönetim Paneli</h1>
      <p>Devam etmek için giriş yap</p>
    </div>
    <label>E-posta</label>
    <input id="girisEposta" type="email" placeholder="ornek@mail.com" autocomplete="username" />
    <label>Şifre</label>
    <input id="girisSifre" type="password" placeholder="••••••••" autocomplete="current-password" />
    <button class="anaButon" id="girisButonu">Giriş Yap</button>
    <div class="hataMesaji hidden" id="girisHata"></div>
  </div>
</div>

<div id="panelEkrani" class="hidden">
  <div class="ustBar">
    <h1>Yönetim Paneli</h1>
    <button class="cikisButon" id="cikisButonu">Çıkış Yap</button>
  </div>

  <div class="sekmeler">
    <button class="sekmeButon aktif" data-sekme="geriBildirim">Geri Bildirimler</button>
    <button class="sekmeButon" data-sekme="kullanicilar">Kayıtlı Kullanıcılar</button>
    <button class="sekmeButon" data-sekme="silinenGeriBildirim">Silinen Geri Bildirimler</button>
    <button class="sekmeButon" data-sekme="silinenKullanicilar">Silinen Kullanıcılar</button>
  </div>

  <div id="geriBildirimListesi"></div>
  <div id="kullaniciListesi" class="hidden"></div>
  <div id="silinenGeriBildirimListesi" class="hidden"></div>
  <div id="silinenKullaniciListesi" class="hidden"></div>
</div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
  import {
    getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
  } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
  import {
    getFirestore, collection, query, orderBy, onSnapshot, doc, updateDoc, deleteField, serverTimestamp
  } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

  const firebaseConfig = {
    apiKey: "KALDIRILDI_FIREBASE_API_KEY",
    authDomain: "maas-primtakip.firebaseapp.com",
    projectId: "maas-primtakip",
    storageBucket: "maas-primtakip.firebasestorage.app",
    messagingSenderId: "589781739238",
    appId: "1:589781739238:web:0512b7d1b174550ae87d27",
    measurementId: "G-40MYEFZ2HC"
  };

  const EMAILJS_SERVICE_ID = 'KALDIRILDI_EMAILJS_SERVICE_ID';
  const EMAILJS_TEMPLATE_ID = 'KALDIRILDI_EMAILJS_TEMPLATE_ID';
  const EMAILJS_PUBLIC_KEY = 'KALDIRILDI_EMAILJS_PUBLIC_KEY';

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const girisEkrani = document.getElementById('girisEkrani');
  const panelEkrani = document.getElementById('panelEkrani');
  const girisButonu = document.getElementById('girisButonu');
  const girisHata = document.getElementById('girisHata');
  const cikisButonu = document.getElementById('cikisButonu');
  const sekmeButonlari = document.querySelectorAll('.sekmeButon');
  const listeKutulari = {
    geriBildirim: document.getElementById('geriBildirimListesi'),
    kullanicilar: document.getElementById('kullaniciListesi'),
    silinenGeriBildirim: document.getElementById('silinenGeriBildirimListesi'),
    silinenKullanicilar: document.getElementById('silinenKullaniciListesi'),
  };
  const geriBildirimListesi = listeKutulari.geriBildirim;
  const kullaniciListesi = listeKutulari.kullanicilar;
  const silinenGeriBildirimListesi = listeKutulari.silinenGeriBildirim;
  const silinenKullaniciListesi = listeKutulari.silinenKullanicilar;

  girisButonu.addEventListener('click', async () => {
    const eposta = document.getElementById('girisEposta').value.trim();
    const sifre = document.getElementById('girisSifre').value;
    girisHata.classList.add('hidden');
    try {
      await signInWithEmailAndPassword(auth, eposta, sifre);
    } catch (e) {
      girisHata.textContent = 'Giriş başarısız: e-posta veya şifre hatalı.';
      girisHata.classList.remove('hidden');
    }
  });

  cikisButonu.addEventListener('click', () => signOut(auth));

  sekmeButonlari.forEach(buton => {
    buton.addEventListener('click', () => {
      sekmeButonlari.forEach(b => b.classList.remove('aktif'));
      buton.classList.add('aktif');
      Object.entries(listeKutulari).forEach(([anahtar, kutu]) => {
        kutu.classList.toggle('hidden', anahtar !== buton.dataset.sekme);
      });
    });
  });

  function tarihFormatla(ts) {
    if (!ts || !ts.toDate) return '';
    return ts.toDate().toLocaleString('tr-TR');
  }

  async function silDurumunuGuncelle(koleksiyon, id, silinsinMi) {
    await updateDoc(doc(db, koleksiyon, id), silinsinMi
      ? { silindi: true, silinmeTarihi: serverTimestamp() }
      : { silindi: false, silinmeTarihi: deleteField() });
  }

  function feedbackKartOlustur(id, veri, silinmisMi) {
    const kart = document.createElement('div');
    kart.className = 'kart';

    const isimSatiri = [veri.isim, veri.soyisim].filter(Boolean).join(' ') || 'İsimsiz Kullanıcı';
    const yanitlandiMi = veri.durum === 'Yanıtlandı';

    kart.innerHTML = `
      <div class="kartUst">
        <div>
          <div class="kartIsim">${isimSatiri}</div>
          <div class="kartEposta">${veri.eposta || 'e-posta yok'}</div>
        </div>
        <span class="${silinmisMi ? 'silinmisRozet' : `rozet ${yanitlandiMi ? 'yanitlandi' : 'yeni'}`}">${silinmisMi ? 'Silindi' : (yanitlandiMi ? 'Yanıtlandı' : 'Yeni')}</span>
      </div>
      <div class="mesajMetni">${veri.mesaj || ''}</div>
      <div class="tarihMetni">${tarihFormatla(veri.tarih)} · ${veri.platform || ''}</div>
      ${(!silinmisMi && yanitlandiMi) ? `<div class="verilenYanit"><b>Yanıtınız:</b> ${veri.yanit || ''}</div>` : ''}
      ${(!silinmisMi && !yanitlandiMi) ? `
        <div class="yanitAlani">
          <textarea placeholder="Yanıtınızı yazın..."></textarea>
          <br />
          <button class="yanitButon">Yanıtla ve E-posta Gönder</button>
        </div>
      ` : ''}
      <div class="kartAltSatir">
        <button class="${silinmisMi ? 'geriYukleButon' : 'silButon'}">${silinmisMi ? 'Geri Yükle' : 'Sil'}</button>
      </div>
    `;

    if (!silinmisMi && !yanitlandiMi) {
      const textarea = kart.querySelector('textarea');
      const buton = kart.querySelector('.yanitButon');
      buton.addEventListener('click', async () => {
        const yanitMetni = textarea.value.trim();
        if (!yanitMetni) { alert('Lütfen bir yanıt yazın.'); return; }
        if (!veri.eposta) { alert('Bu kullanıcının e-posta adresi kayıtlı değil, e-posta gönderilemez.'); return; }

        buton.disabled = true;
        buton.textContent = 'Gönderiliyor...';
        try {
          await updateDoc(doc(db, 'geribildirimler', id), {
            durum: 'Yanıtlandı',
            yanit: yanitMetni,
            yanitTarihi: serverTimestamp(),
          });

          await fetch('https://api.emailjs.com/api/v1.0/email/send', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              service_id: EMAILJS_SERVICE_ID,
              template_id: EMAILJS_TEMPLATE_ID,
              user_id: EMAILJS_PUBLIC_KEY,
              template_params: {
                to_email: veri.eposta,
                isim: veri.isim || '',
                soyisim: veri.soyisim || '',
                mesaj: veri.mesaj || '',
                icerik: yanitMetni,
              },
            }),
          });
        } catch (e) {
          alert('Bir hata oluştu: ' + e.message);
          buton.disabled = false;
          buton.textContent = 'Yanıtla ve E-posta Gönder';
        }
      });
    }

    kart.querySelector(silinmisMi ? '.geriYukleButon' : '.silButon').addEventListener('click', async () => {
      if (!silinmisMi && !confirm('Bu geri bildirimi silinenler alanına taşımak istiyor musun?')) return;
      await silDurumunuGuncelle('geribildirimler', id, !silinmisMi);
    });

    return kart;
  }

  function kullaniciKartOlustur(id, veri, silinmisMi) {
    const kart = document.createElement('div');
    kart.className = 'kart';
    const isimSatiri = [veri.isim, veri.soyisim].filter(Boolean).join(' ') || 'İsimsiz Kullanıcı';
    kart.innerHTML = `
      <div class="kartUst">
        <div>
          <div class="kartIsim">${isimSatiri}</div>
          <div class="kartEposta">${veri.eposta || 'e-posta yok'}</div>
        </div>
        ${silinmisMi ? '<span class="silinmisRozet">Silindi</span>' : ''}
      </div>
      <div class="tarihMetni">Kayıt: ${tarihFormatla(veri.kayitTarihi)} · ${veri.platform || ''}</div>
      <div class="kartAltSatir">
        <button class="${silinmisMi ? 'geriYukleButon' : 'silButon'}">${silinmisMi ? 'Geri Yükle' : 'Sil'}</button>
      </div>
    `;

    kart.querySelector(silinmisMi ? '.geriYukleButon' : '.silButon').addEventListener('click', async () => {
      if (!silinmisMi && !confirm(`"${isimSatiri}" kullanıcısını silinenler alanına taşımak istiyor musun?`)) return;
      await silDurumunuGuncelle('kullanicilar', id, !silinmisMi);
    });

    return kart;
  }

  let geriBildirimAboneligi = null;
  let kullaniciAboneligi = null;

  function verileriDinlemeyeBasla() {
    const gbSorgu = query(collection(db, 'geribildirimler'), orderBy('tarih', 'desc'));
    geriBildirimAboneligi = onSnapshot(gbSorgu, (snap) => {
      geriBildirimListesi.innerHTML = '';
      silinenGeriBildirimListesi.innerHTML = '';
      let aktifSayisi = 0;
      let silinenSayisi = 0;
      snap.forEach(d => {
        const veri = d.data();
        if (veri.silindi === true) {
          silinenSayisi++;
          silinenGeriBildirimListesi.appendChild(feedbackKartOlustur(d.id, veri, true));
        } else {
          aktifSayisi++;
          geriBildirimListesi.appendChild(feedbackKartOlustur(d.id, veri, false));
        }
      });
      if (aktifSayisi === 0) geriBildirimListesi.innerHTML = '<div class="bosDurum">Henüz geri bildirim yok.</div>';
      if (silinenSayisi === 0) silinenGeriBildirimListesi.innerHTML = '<div class="bosDurum">Silinen geri bildirim yok.</div>';
    });

    const kSorgu = query(collection(db, 'kullanicilar'), orderBy('kayitTarihi', 'desc'));
    kullaniciAboneligi = onSnapshot(kSorgu, (snap) => {
      kullaniciListesi.innerHTML = '';
      silinenKullaniciListesi.innerHTML = '';
      let aktifSayisi = 0;
      let silinenSayisi = 0;
      snap.forEach(d => {
        const veri = d.data();
        if (veri.silindi === true) {
          silinenSayisi++;
          silinenKullaniciListesi.appendChild(kullaniciKartOlustur(d.id, veri, true));
        } else {
          aktifSayisi++;
          kullaniciListesi.appendChild(kullaniciKartOlustur(d.id, veri, false));
        }
      });
      if (aktifSayisi === 0) kullaniciListesi.innerHTML = '<div class="bosDurum">Henüz kayıtlı kullanıcı yok.</div>';
      if (silinenSayisi === 0) silinenKullaniciListesi.innerHTML = '<div class="bosDurum">Silinen kullanıcı yok.</div>';
    });
  }

  function dinlemeyiDurdur() {
    if (geriBildirimAboneligi) geriBildirimAboneligi();
    if (kullaniciAboneligi) kullaniciAboneligi();
  }

  onAuthStateChanged(auth, (user) => {
    if (user) {
      girisEkrani.classList.add('hidden');
      panelEkrani.classList.remove('hidden');
      verileriDinlemeyeBasla();
    } else {
      panelEkrani.classList.add('hidden');
      girisEkrani.classList.remove('hidden');
      dinlemeyiDurdur();
    }
  });
</script>

</body>
</html>
